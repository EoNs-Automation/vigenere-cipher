<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Vigenère Cipher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 24px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
            color: #cccccc;
        }
        textarea, input {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: 1px solid #444;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #2d2d2d;
            color: #ffffff;
        }
        textarea {
            height: 130px;
            resize: vertical;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 16px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }
        #encryptBtn {
            background-color: #2e7d32;
        }
        #decryptBtn {
            background-color: #1565c0;
        }
        #result {
            margin-top: 28px;
            padding: 16px;
            background-color: #2d2d2d;
            border-radius: 10px;
            border: 1px solid #444;
            min-height: 90px;
            word-wrap: break-word;
        }
        .result-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #aaaaaa;
        }
        #output {
            color: #ffffff;
            font-size: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Vigenère Cipher</h1>

    <label for="message">Message:</label>
    <textarea id="message" placeholder="Type or paste your message here..."></textarea>

    <label for="passcode">Passcode:</label>
    <input type="text" id="passcode" placeholder="Enter passcode">

    <div class="buttons">
        <button id="encryptBtn">Encrypt</button>
        <button id="decryptBtn">Decrypt</button>
    </div>

    <div id="result">
        <div class="result-label">Result:</div>
        <div id="output">Your result will appear here...</div>
    </div>

    <script>
        function vigenere(message, key, direction) {
            let keyIndex = 0;
            const alphabet = 'abcdefghijklmnopqrstuvwxyz';
            let finalMessage = '';

            message = message.toLowerCase();
            key = key.toLowerCase();

            for (let i = 0; i < message.length; i++) {
                const char = message[i];

                if (alphabet.indexOf(char) === -1) {
                    finalMessage += char;
                } else {
                    const keyChar = key[keyIndex % key.length];
                    keyIndex++;

                    const offset = alphabet.indexOf(keyChar);
                    const index = alphabet.indexOf(char);
                    let newIndex = (index + offset * direction) % 26;
                    if (newIndex < 0) newIndex += 26;

                    finalMessage += alphabet[newIndex];
                }
            }
            return finalMessage;
        }

        function processMessage(direction) {
            const message = document.getElementById('message').value.trim();
            const passcode = document.getElementById('passcode').value.trim();
            const output = document.getElementById('output');

            if (message === '' || passcode === '') {
                output.textContent = "Please enter both a message and a passcode.";
                return;
            }

            const result = vigenere(message, passcode, direction);
            output.textContent = result;
        }

        // Better event listeners for mobile
        document.getElementById('encryptBtn').addEventListener('click', function() {
            processMessage(1);
        });

        document.getElementById('decryptBtn').addEventListener('click', function() {
            processMessage(-1);
        });
    </script>
</body>
</html>
